<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Genesis Lab - Headless test</title>
  <style>
    body { margin: 0; padding: 24px; background: #050B18; color: #CFE8FF;
           font: 14px/1.5 "Inter", system-ui, "Segoe UI", sans-serif; }
    h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: 0.25em; color: #22E5FF; }
    p { margin: 0 0 16px; color: #6E87A8; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }
    label { font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: #6E87A8; }
    input { background: #0A1630; color: #CFE8FF; border: 1px solid rgba(140,200,255,0.25);
            border-radius: 6px; padding: 6px 8px; font: 13px "JetBrains Mono", Consolas, monospace; width: 110px; }
    button { background: #0A1630; color: #22E5FF; border: 1px solid rgba(34,229,255,0.5); border-radius: 6px;
             padding: 7px 16px; font-weight: 600; letter-spacing: 0.08em; cursor: pointer; }
    button:disabled { opacity: 0.4; cursor: default; }
    #progress { color: #39FF88; font: 13px "JetBrains Mono", Consolas, monospace; }
    pre { background: rgba(10,22,48,0.7); border: 1px solid rgba(140,200,255,0.15); border-radius: 12px;
          padding: 16px; overflow-x: auto; font: 12.5px/1.45 "JetBrains Mono", Consolas, monospace; white-space: pre; }
  </style>
</head>
<body>
  <h1>GENESIS LAB &middot; HEADLESS TEST</h1>
  <p>Runs the simulation flat out with no drawing, then prints a report. Same seed, same world, every time.</p>
  <div class="row">
    <label for="seeds">Seeds</label><input id="seeds" value="1,2,3">
    <label for="minutes">Simulated minutes</label><input id="minutes" value="10">
    <button id="run">Run</button>
    <span id="progress"></span>
  </div>
  <pre id="report">Starting...</pre>

  <!-- The simulation only: no drawing code is loaded here. -->
  <script src="../js/config.js"></script>
  <script src="../js/core/rng.js"></script>
  <script src="../js/core/math.js"></script>
  <script src="../js/core/noise.js"></script>
  <script src="../js/core/spatialGrid.js"></script>
  <script src="../js/sim/genome.js"></script>
  <script src="../js/sim/brain.js"></script>
  <script src="../js/sim/events.js"></script>
  <script src="../js/sim/story.js"></script>
  <script src="../js/sim/stats.js"></script>
  <script src="../js/sim/food.js"></script>
  <script src="../js/sim/creature.js"></script>
  <script src="../js/sim/world.js"></script>
  <script src="headless.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var seedsBox = document.getElementById('seeds'), minutesBox = document.getElementById('minutes');
      var runBtn = document.getElementById('run'), progress = document.getElementById('progress');
      var report = document.getElementById('report');
      if (params.get('seeds')) seedsBox.value = params.get('seeds');
      if (params.get('minutes')) minutesBox.value = params.get('minutes');

      function start() {
        var seeds = seedsBox.value.split(',').map(function (s) { return parseInt(s, 10); })
          .filter(function (s) { return !isNaN(s); });
        var minutes = Math.max(1, parseFloat(minutesBox.value) || 10);
        var results = [], text = [], index = 0, run = null;
        window.headlessDone = false;
        runBtn.disabled = true;
        report.textContent = 'Running ' + seeds.length + ' seed(s) for ' + minutes + ' simulated minutes each...';
        function chunk() {
          if (!run) run = new GL.Headless.SeedRun(seeds[index], minutes);
          var done = run.advance(1200);
          var simMin = run.world.time / 60;
          progress.textContent = 'Seed ' + seeds[index] + ' (' + (index + 1) + ' of ' + seeds.length + '): ' +
            simMin.toFixed(1) + ' of ' + minutes + ' simulated minutes';
          if (done) {
            var r = run.result();
            results.push(r);
            text.push(GL.Headless.formatSeed(r));
            report.textContent = text.join('\n\n');
            run = null;
            index++;
          }
          if (index < seeds.length) { setTimeout(chunk, 0); return; }
          text.push(GL.Headless.formatSummary(results));
          report.textContent = text.join('\n\n');
          progress.textContent = 'Done.';
          runBtn.disabled = false;
          window.headlessResults = results;
          window.headlessDone = true;
          document.title = 'Genesis Lab - Headless test (done)';
        }
        setTimeout(chunk, 30);
      }
      runBtn.addEventListener('click', start);
      start();
    })();
  </script>
</body>
</html>
